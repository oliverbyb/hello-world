<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>雷达显控 · 参数配置</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0d1117; --bg1:#161b22; --bg2:#1c2128; --bg3:#21262d;
  --bd:#30363d;  --bdf:#388bfd;
  --t1:#e6edf3;  --t2:#8b949e;  --t3:#484f58;
  --blue:#388bfd; --green:#3fb950; --yellow:#e3b341;
  --red:#f85149;  --purple:#a371f7; --cyan:#79c0ff;
  --r:6px; --rs:4px;
  --sh:0 4px 24px rgba(0,0,0,.5);
}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
     background:var(--bg0);color:var(--t1);height:100vh;
     display:flex;flex-direction:column;overflow:hidden;font-size:13px}

/* ── Toolbar ── */
.toolbar{
  height:44px;background:var(--bg1);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0;z-index:50
}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;
      color:var(--blue);letter-spacing:.4px}
.vsep{width:1px;height:22px;background:var(--bd)}
.chip{font-size:11px;color:var(--t2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);
     box-shadow:0 0 5px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tba{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;
     border-radius:var(--rs);font-size:12px;cursor:pointer;border:none;
     transition:filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn-ghost{background:var(--bg3);color:var(--t1);border:1px solid var(--bd)}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#000}
.btn-yellow{background:var(--yellow);color:#000}
.btn-red{background:var(--red);color:#fff}

/* ── Three-column shell ── */
.shell{display:flex;flex:1;overflow:hidden}

/* ── Col 1: Board list ── */
.col-boards{
  width:170px;min-width:150px;flex-shrink:0;
  background:var(--bg1);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden
}
.col-hd{
  padding:8px 10px 6px;font-size:10px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--bd);
  flex-shrink:0
}
.board-list{flex:1;overflow-y:auto;padding:4px}
.board-item{
  display:flex;align-items:center;gap:7px;padding:7px 8px;
  border-radius:var(--rs);cursor:pointer;color:var(--t2);
  transition:background .12s,color .12s;margin-bottom:1px;position:relative
}
.board-item:hover{background:var(--bg3);color:var(--t1)}
.board-item.sel{background:var(--bg3);color:var(--blue);font-weight:600}
.board-item.sel::before{
  content:'';position:absolute;left:0;top:3px;bottom:3px;
  width:3px;background:var(--blue);border-radius:2px
}
.board-badge{
  margin-left:auto;font-size:10px;padding:1px 5px;border-radius:8px;
  background:var(--bg0);color:var(--t3)
}
.board-item.dirty .board-badge{background:var(--yellow);color:#000}
.board-item.sel .board-badge{background:var(--blue);color:#fff}
.face-sep{
  font-size:10px;color:var(--t3);padding:6px 8px 2px;
  letter-spacing:.5px;text-transform:uppercase
}

/* ── Col 2: Param navigation tree ── */
.col-nav{
  width:190px;min-width:170px;flex-shrink:0;
  background:var(--bg1);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden
}
.nav-tree{flex:1;overflow-y:auto;padding:6px 4px}
.nav-category{margin-bottom:2px}
.nav-cat-hd{
  display:flex;align-items:center;gap:6px;
  padding:6px 8px;border-radius:var(--rs);
  cursor:pointer;font-weight:600;font-size:12px;color:var(--t2);
  transition:background .12s,color .12s;user-select:none
}
.nav-cat-hd:hover{background:var(--bg3);color:var(--t1)}
.nav-cat-hd.open{color:var(--t1)}
.caret{font-size:10px;transition:transform .2s;color:var(--t3);flex-shrink:0}
.nav-cat-hd.open .caret{transform:rotate(90deg)}
.nav-cat-cnt{font-size:10px;margin-left:auto;color:var(--t3);padding:0 4px}
.nav-children{display:none;padding-left:10px}
.nav-cat-hd.open + .nav-children{display:block}
.nav-leaf{
  display:flex;align-items:center;gap:6px;
  padding:5px 8px;border-radius:var(--rs);
  cursor:pointer;font-size:12px;color:var(--t2);
  transition:background .12s,color .12s;margin-bottom:1px
}
.nav-leaf:hover{background:var(--bg3);color:var(--t1)}
.nav-leaf.sel{background:var(--bg2);color:var(--blue);font-weight:600}
.nav-leaf-cnt{font-size:10px;margin-left:auto;color:var(--t3)}
.nav-leaf.dirty .nav-leaf-cnt{color:var(--yellow)}

/* ── Col 3: Param form ── */
.col-form{
  flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0
}
.form-header{
  background:var(--bg1);border-bottom:1px solid var(--bd);
  padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0
}
.form-title{font-size:15px;font-weight:700}
.form-path{font-size:11px;color:var(--t2)}
.form-actions{margin-left:auto;display:flex;gap:6px}

/* search bar */
.search-bar{
  padding:7px 14px;border-bottom:1px solid var(--bd);
  background:var(--bg1);display:flex;align-items:center;gap:8px;flex-shrink:0
}
.search-input{
  flex:1;background:var(--bg0);border:1px solid var(--bd);
  color:var(--t1);padding:4px 10px;border-radius:var(--rs);
  font-size:12px;outline:none;transition:border-color .15s
}
.search-input:focus{border-color:var(--bdf)}
.search-hint{font-size:11px;color:var(--t3);white-space:nowrap}

/* param table */
.param-scroll{flex:1;overflow-y:auto;padding:14px}
.param-table-wrap{
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  overflow:hidden;margin-bottom:14px
}
.param-table-title{
  padding:9px 14px;background:var(--bg3);border-bottom:1px solid var(--bd);
  font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px
}
.ptable{width:100%;border-collapse:collapse;font-size:12px}
.ptable th{
  background:var(--bg3);color:var(--t2);font-weight:600;
  padding:7px 12px;text-align:left;border-bottom:1px solid var(--bd);
  white-space:nowrap;position:sticky;top:0
}
.ptable td{
  padding:6px 10px;border-bottom:1px solid var(--bd);
  vertical-align:middle;color:var(--t1)
}
.ptable tr:last-child td{border-bottom:none}
.ptable tr:hover td{background:rgba(255,255,255,.03)}
.ptable tr.modified-row td:first-child{
  border-left:2px solid var(--yellow)
}
.td-key{color:var(--t2);font-family:monospace;font-size:11px;white-space:nowrap;max-width:120px}
.td-label{white-space:nowrap;min-width:100px}
.td-unit{color:var(--t3);font-size:11px;white-space:nowrap}
.td-range{color:var(--t3);font-size:11px;white-space:nowrap}
.td-ctrl{min-width:200px}
.td-desc{color:var(--t2);font-size:11px;max-width:220px}

/* controls */
.cinput{
  background:var(--bg0);border:1px solid var(--bd);color:var(--t1);
  padding:4px 8px;border-radius:var(--rs);font-size:12px;
  outline:none;width:100%;transition:border-color .15s;font-family:inherit
}
.cinput:focus{border-color:var(--bdf)}
.cinput.mod{border-color:var(--yellow);background:rgba(227,179,65,.06)}
select.cinput{cursor:pointer}
.crange-wrap{display:flex;align-items:center;gap:6px}
.crange{
  flex:1;height:4px;cursor:pointer;background:var(--bd);border:none;
  border-radius:2px;accent-color:var(--blue);outline:none
}
.crange-val{font-size:11px;color:var(--blue);font-weight:600;min-width:36px;text-align:right}
.ctoggle-row{display:flex;align-items:center;gap:8px;cursor:pointer;width:fit-content}
.ctoggle{
  width:32px;height:17px;border-radius:9px;background:var(--bd);
  position:relative;transition:background .2s;flex-shrink:0
}
.ctoggle.on{background:var(--blue)}
.ctoggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:13px;height:13px;border-radius:50%;background:#fff;transition:left .2s
}
.ctoggle.on::after{left:17px}
.toggle-label{font-size:12px}

/* highlight matched text */
.hl{background:rgba(88,166,255,.25);border-radius:2px;color:var(--cyan)}

/* empty state */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:12px;color:var(--t3)
}
.empty svg{opacity:.25}

/* status bar */
.sbar{
  background:var(--bg1);border-top:1px solid var(--bd);
  padding:3px 14px;display:flex;align-items:center;gap:12px;
  font-size:11px;color:var(--t3);flex-shrink:0
}
.sbar .sv{color:var(--t2)} .sbar .vsep{height:12px}

/* ── Compare dialog ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:200;display:none;align-items:center;justify-content:center
}
.overlay.show{display:flex}
.dialog{
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  width:min(95vw,1000px);max-height:85vh;
  display:flex;flex-direction:column;box-shadow:var(--sh);overflow:hidden
}
.dlg-hd{
  padding:12px 16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;flex-shrink:0
}
.dlg-title{font-size:14px;font-weight:700}
.dlg-x{margin-left:auto;cursor:pointer;color:var(--t2);font-size:18px;line-height:1}
.dlg-x:hover{color:var(--t1)}
.dlg-body{overflow:auto;padding:14px}

.cmp-table{width:100%;border-collapse:collapse;font-size:12px}
.cmp-table th{
  background:var(--bg3);color:var(--t2);padding:7px 10px;
  text-align:left;border-bottom:1px solid var(--bd);
  white-space:nowrap;position:sticky;top:0
}
.cmp-table td{padding:6px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.cmp-table tr:hover td{background:rgba(255,255,255,.03)}
.cmp-diff{color:var(--yellow);font-weight:600}
.cmp-same{color:var(--t3)}

/* ── Config dialog ── */
.cfg-dialog{
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  width:min(95vw,540px);display:flex;flex-direction:column;box-shadow:var(--sh)
}
.cfg-list{padding:8px 14px 4px;display:flex;flex-direction:column;gap:5px;max-height:350px;overflow-y:auto}
.cfg-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;
  background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rs);
}
.cfg-name{font-size:13px;font-weight:600}
.cfg-meta{font-size:11px;color:var(--t3)}
.cfg-ia{margin-left:auto;display:flex;gap:5px}
.save-row{display:flex;gap:7px;padding:8px 14px 12px}
.save-input{
  flex:1;background:var(--bg0);border:1px solid var(--bd);color:var(--t1);
  padding:6px 10px;border-radius:var(--rs);font-size:12px;outline:none
}
.save-input:focus{border-color:var(--bdf)}

/* ── Toast ── */
.tc{position:fixed;bottom:36px;right:20px;z-index:999;display:flex;flex-direction:column;gap:6px}
.toast{
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rs);
  padding:8px 14px;font-size:12px;color:var(--t1);box-shadow:var(--sh);
  animation:fadeIn .2s ease;display:flex;align-items:center;gap:7px
}
.toast.ok{border-left:3px solid var(--green)}
.toast.warn{border-left:3px solid var(--yellow)}
.toast.err{border-left:3px solid var(--red)}
@keyframes fadeIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--t3)}
</style>
</head>
<body>

<!-- ───────── Toolbar ───────── -->
<div class="toolbar">
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>
      <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
    </svg>
    雷达显控系统
  </div>
  <div class="vsep"></div>
  <span class="chip">多阵面参数配置</span>
  <div class="dot" title="系统在线"></div>
  <span style="font-size:11px;color:var(--green)">在线</span>
  <div class="tba">
    <button class="btn btn-ghost" onclick="openCmp()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>跨阵面对比
    </button>
    <button class="btn btn-ghost" onclick="openCfg()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
      </svg>配置组
    </button>
    <button class="btn btn-green" onclick="sendAll()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>下发全部
    </button>
  </div>
</div>

<!-- ───────── Shell ───────── -->
<div class="shell">

  <!-- Col 1: Board list -->
  <div class="col-boards">
    <div class="col-hd">阵面板卡</div>
    <div class="board-list" id="boardList"></div>
  </div>

  <!-- Col 2: Nav tree -->
  <div class="col-nav">
    <div class="col-hd">参数导航</div>
    <div class="nav-tree" id="navTree">
      <div class="empty" style="height:200px">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span style="font-size:12px">请先选择板卡</span>
      </div>
    </div>
  </div>

  <!-- Col 3: Param form -->
  <div class="col-form">
    <div class="form-header" id="formHeader">
      <div>
        <div class="form-title" id="formTitle">—</div>
        <div class="form-path" id="formPath">选择左侧分类以查看参数</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="readParams()">读取</button>
        <button class="btn btn-yellow" onclick="sendBoard()">下发本板卡</button>
        <button class="btn btn-ghost" onclick="resetBoard()">重置</button>
      </div>
    </div>
    <div class="search-bar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3);flex-shrink:0">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="search-input" id="searchInput" placeholder="搜索参数名 / 关键字…" oninput="onSearch()"/>
      <span class="search-hint" id="searchHint"></span>
    </div>
    <div class="param-scroll" id="paramScroll">
      <div class="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span style="font-size:13px">请从左侧导航树选择参数分类</span>
      </div>
    </div>
  </div>

</div>

<!-- ───────── Status bar ───────── -->
<div class="sbar">
  <span>板卡：</span><span class="sv" id="sb1">未选择</span>
  <div class="vsep" style="width:1px;height:12px;background:var(--bd)"></div>
  <span>分类：</span><span class="sv" id="sb2">—</span>
  <div class="vsep" style="width:1px;height:12px;background:var(--bd)"></div>
  <span>已修改：</span><span class="sv" id="sb3" style="color:var(--yellow)">0 项</span>
  <div class="vsep" style="width:1px;height:12px;background:var(--bd)"></div>
  <span id="sbtime">—</span>
</div>

<!-- ───────── Compare overlay ───────── -->
<div class="overlay" id="cmpOverlay" onclick="closeIfBg(event,'cmpOverlay')">
  <div class="dialog">
    <div class="dlg-hd">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span class="dlg-title">跨阵面参数对比</span>
      <div style="margin-left:12px;display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;color:var(--t2)">分类：</span>
        <select class="cinput" id="cmpType" style="width:160px" onchange="renderCmp()"></select>
        <label style="display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer;color:var(--t2)">
          <input type="checkbox" id="cmpDiffOnly" onchange="renderCmp()" style="accent-color:var(--blue)"/>只看差异
        </label>
      </div>
      <span class="dlg-x" onclick="document.getElementById('cmpOverlay').classList.remove('show')">×</span>
    </div>
    <div class="dlg-body"><table class="cmp-table" id="cmpTable"></table></div>
  </div>
</div>

<!-- ───────── Config overlay ───────── -->
<div class="overlay" id="cfgOverlay" onclick="closeIfBg(event,'cfgOverlay')">
  <div class="cfg-dialog">
    <div class="dlg-hd">
      <span class="dlg-title">配置组管理</span>
      <span class="dlg-x" onclick="document.getElementById('cfgOverlay').classList.remove('show')">×</span>
    </div>
    <div style="padding:6px 14px 4px;font-size:11px;color:var(--t2)">
      每个配置组保存所有板卡、所有参数的完整快照，可随时加载恢复。
    </div>
    <div class="cfg-list" id="cfgList"></div>
    <div style="padding:4px 14px 4px;font-size:11px;color:var(--t2)">新建配置组</div>
    <div class="save-row">
      <input class="save-input" id="saveNameInput" placeholder="配置组名称，如：任务A搜索模式"/>
      <button class="btn btn-blue" onclick="saveConfig()">保存</button>
    </div>
  </div>
</div>

<div class="tc" id="tc"></div>

<script>
/* ══════════════════════════════════════════════
   数据模型 — 参数 Schema
   结构：类别(category) → 子类(subcat) → 参数列表
   ══════════════════════════════════════════════ */
const SCHEMA = {
  /* ─── 雷控参数 ─── */
  radar: {
    label: '雷控参数', icon: '📡',
    subs: {
      tx: {
        label: '发射控制', params: [
          { key:'tx_power',   label:'发射功率',       unit:'dBm',  type:'num',  min:0,    max:100,   step:0.1,  def:43.5,  desc:'末级放大器输出功率' },
          { key:'tx_freq',    label:'载波频率',       unit:'MHz',  type:'num',  min:2000, max:8000,  step:1,    def:3500,  desc:'射频载波中心频率' },
          { key:'prf',        label:'重复频率(PRF)',  unit:'Hz',   type:'num',  min:100,  max:5000,  step:10,   def:1000,  desc:'脉冲重复频率' },
          { key:'pri',        label:'重复周期(PRI)',  unit:'ms',   type:'num',  min:0.2,  max:10,    step:0.01, def:1.0,   desc:'脉冲重复间隔' },
          { key:'pw',         label:'脉冲宽度',       unit:'μs',   type:'num',  min:0.1,  max:100,   step:0.1,  def:10,    desc:'发射脉冲时宽' },
          { key:'duty',       label:'占空比',         unit:'%',    type:'num',  min:0.01, max:50,    step:0.01, def:1.0,   desc:'PW/PRI×100%' },
          { key:'tx_en',      label:'发射使能',                    type:'tog',                                 def:true,  desc:'控制发射通道开关' },
          { key:'chirp_dir',  label:'线调方向',                    type:'sel',  opts:['上调频','下调频'],      def:'上调频',desc:'LFM调频方向' },
        ]

const BOARDS = [
  { id:'A1', label:'主板卡',   face:'阵面A', ip:'192.168.1.101' },
  { id:'A2', label:'信处板卡', face:'阵面A', ip:'192.168.1.102' },
  { id:'B1', label:'主板卡',   face:'阵面B', ip:'192.168.1.201' },
  { id:'B2', label:'信处板卡', face:'阵面B', ip:'192.168.1.202' },
  { id:'C1', label:'主板卡',   face:'阵面C', ip:'192.168.1.301' },
  { id:'C2', label:'信处板卡', face:'阵面C', ip:'192.168.1.302' },
];

/* ─── 状态 ─── */
let curBoard = null, curCat = null, curSub = null;
const data = {};   // data[boardId][cat][sub][key] = value
const mods = {};   // mods[boardId] = Set<"cat/sub/key">

function initData() {
  BOARDS.forEach(b => {
    data[b.id] = {}; mods[b.id] = new Set();
    Object.entries(SCHEMA).forEach(([cat, cv]) => {
      data[b.id][cat] = {};
      Object.entries(cv.subs).forEach(([sub, sv]) => {
        data[b.id][cat][sub] = {};
        sv.params.forEach(p => {
          let v = p.def;
          if (typeof v === 'number' && b.id !== 'A1')
            v = +(v * (1 + (Math.random()-.5)*.08)).toFixed(3);
          data[b.id][cat][sub][p.key] = v;
        });
      });
    });
  });
}

function setVal(cat, sub, key, v) {
  data[curBoard][cat][sub][key] = v;
  mods[curBoard].add(`${cat}/${sub}/${key}`);
  refreshBoardBadges(); updateSbar();
}

/* ─── Board list ─── */
function buildBoardList() {
  const el = document.getElementById('boardList');
  el.innerHTML = '';
  const faces = [...new Set(BOARDS.map(b => b.face))];
  faces.forEach(face => {
    const sep = document.createElement('div');
    sep.className = 'face-sep'; sep.textContent = face;
    el.appendChild(sep);
    BOARDS.filter(b => b.face === face).forEach(b => {
      const item = document.createElement('div');
      item.className = 'board-item'; item.id = 'bi-'+b.id;
      item.onclick = () => selectBoard(b.id);
      item.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.5;flex-shrink:0">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${b.label}</span>
        <span class="board-badge" id="bb-${b.id}">✓</span>`;
      el.appendChild(item);
    });
  });
}

function refreshBoardBadges() {
  BOARDS.forEach(b => {
    const n = mods[b.id].size;
    const bb = document.getElementById('bb-'+b.id);
    const bi = document.getElementById('bi-'+b.id);
    if (bb) bb.textContent = n > 0 ? n : '✓';
    if (bi) bi.classList.toggle('dirty', n > 0);
  });
}

function selectBoard(id) {
  curBoard = id;
  document.querySelectorAll('.board-item').forEach(e => e.classList.remove('sel'));
  document.getElementById('bi-'+id)?.classList.add('sel');
  buildNavTree();
  document.getElementById('sb1').textContent = BOARDS.find(b=>b.id===id)?.label+' ('+id+')';
  // re-render form if sub still valid
  if (curCat && curSub) renderForm(curCat, curSub);
}

/* ─── Nav tree ─── */
function buildNavTree() {
  const tree = document.getElementById('navTree');
  tree.innerHTML = '';
  Object.entries(SCHEMA).forEach(([cat, cv]) => {
    const catEl = document.createElement('div');
    catEl.className = 'nav-category';

    const hd = document.createElement('div');
    hd.className = 'nav-cat-hd' + (cat === curCat ? ' open' : '');
    const totalParams = Object.values(cv.subs).reduce((s,sv)=>s+sv.params.length,0);
    hd.innerHTML = `
      <span class="caret">▶</span>
      <span>${cv.label}</span>
      <span class="nav-cat-cnt">${totalParams}</span>`;
    hd.onclick = () => { hd.classList.toggle('open'); };

    const children = document.createElement('div');
    children.className = 'nav-children';
    Object.entries(cv.subs).forEach(([sub, sv]) => {
      const leaf = document.createElement('div');
      leaf.className = 'nav-leaf' + (cat===curCat && sub===curSub ? ' sel':'');
      leaf.id = `nl-${cat}-${sub}`;
      const modCnt = curBoard ? [...mods[curBoard]].filter(k=>k.startsWith(`${cat}/${sub}/`)).length : 0;
      leaf.innerHTML = `
        <span style="flex:1">${sv.label}</span>
        <span class="nav-leaf-cnt">${modCnt > 0 ? modCnt+'✎' : sv.params.length}</span>`;
      leaf.classList.toggle('dirty', modCnt > 0);
      leaf.onclick = () => {
        document.querySelectorAll('.nav-leaf').forEach(e=>e.classList.remove('sel'));
        leaf.classList.add('sel');
        renderForm(cat, sub);
      };
      children.appendChild(leaf);
    });

    catEl.appendChild(hd);
    catEl.appendChild(children);
    tree.appendChild(catEl);

    // auto-open current cat
    if (cat === curCat) hd.classList.add('open');
  });
}

/* ─── Param form ─── */
let searchQ = '';
function renderForm(cat, sub) {
  curCat = cat; curSub = sub;
  const cv = SCHEMA[cat], sv = cv.subs[sub];
  document.getElementById('formTitle').textContent = `${cv.label} › ${sv.label}`;
  document.getElementById('formPath').textContent =
    `板卡: ${BOARDS.find(b=>b.id===curBoard)?.label} (${curBoard})  ·  共 ${sv.params.length} 个参数`;
  document.getElementById('sb2').textContent = `${cv.label} / ${sv.label}`;

  renderParams();
}

function renderParams() {
  if (!curCat || !curSub || !curBoard) return;
  const sv = SCHEMA[curCat].subs[curSub];
  const q = searchQ.trim().toLowerCase();

  const params = sv.params.filter(p =>
    !q ||
    p.label.toLowerCase().includes(q) ||
    p.key.toLowerCase().includes(q) ||
    (p.desc||'').toLowerCase().includes(q)
  );

  const hint = document.getElementById('searchHint');
  hint.textContent = q ? `找到 ${params.length} / ${sv.params.length} 项` : `共 ${sv.params.length} 项`;

  const scroll = document.getElementById('paramScroll');
  if (!params.length) {
    scroll.innerHTML = `<div class="empty"><span style="font-size:13px;color:var(--t3)">没有匹配的参数「${q}」</span></div>`;
    return;
  }

  // Chunk params into groups of up to 20 for sub-table display
  const CHUNK = 999; // show all in one table for same subcat; chunking only if >30
  const tables = params.length > 30
    ? [params.slice(0, Math.ceil(params.length/2)), params.slice(Math.ceil(params.length/2))]
    : [params];

  scroll.innerHTML = '';
  tables.forEach((chunk, ti) => {
    const wrap = document.createElement('div');
    wrap.className = 'param-table-wrap';
    if (tables.length > 1) {
      const title = document.createElement('div');
      title.className = 'param-table-title';
      title.textContent = `参数列表 (${ti===0?'1':'2'} / ${tables.length})`;
      wrap.appendChild(title);
    }
    const tbl = document.createElement('table');
    tbl.className = 'ptable';
    tbl.innerHTML = `<thead><tr>
      <th style="width:130px">参数名称</th>
      <th style="width:80px">单位</th>
      <th style="width:120px">范围</th>
      <th>当前值</th>
      <th style="max-width:200px">说明</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    chunk.forEach(p => {
      const val = data[curBoard][curCat][curSub][p.key];
      const mod = mods[curBoard].has(`${curCat}/${curSub}/${p.key}`);
      const tr = document.createElement('tr');
      if (mod) tr.className = 'modified-row';

      // label cell
      const labelTd = document.createElement('td');
      labelTd.className = 'td-label';
      labelTd.innerHTML = highlight(p.label, searchQ);

      // unit
      const unitTd = document.createElement('td');
      unitTd.className = 'td-unit';
      unitTd.textContent = p.unit || '—';

      // range
      const rangeTd = document.createElement('td');
      rangeTd.className = 'td-range';
      if (p.type === 'num' || p.type === 'rng')
        rangeTd.textContent = `${p.min} ~ ${p.max}`;
      else if (p.type === 'sel')
        rangeTd.textContent = p.opts.join(' / ').slice(0,28)+(p.opts.join().length>28?'…':'');
      else if (p.type === 'tog')
        rangeTd.textContent = '启用 / 禁用';
      else rangeTd.textContent = '—';

      // control
      const ctrlTd = document.createElement('td');
      ctrlTd.className = 'td-ctrl';
      ctrlTd.appendChild(buildCtrl(p, val, mod));

      // desc
      const descTd = document.createElement('td');
      descTd.className = 'td-desc';
      descTd.textContent = p.desc || '';

      tr.append(labelTd, unitTd, rangeTd, ctrlTd, descTd);
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    scroll.appendChild(wrap);
  });
}

function highlight(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return text;
  return text.slice(0,idx) + `<span class="hl">${text.slice(idx,idx+q.length)}</span>` + text.slice(idx+q.length);
}

function buildCtrl(p, val, mod) {
  const wrap = document.createElement('div');

  if (p.type === 'tog') {
    wrap.className = 'ctoggle-row';
    const tog = document.createElement('div');
    tog.className = 'ctoggle' + (val ? ' on' : '');
    const lbl = document.createElement('span');
    lbl.className = 'toggle-label';
    lbl.style.color = val ? 'var(--green)' : 'var(--t3)';
    lbl.textContent = val ? '启用' : '禁用';
    wrap.onclick = () => {
      const cur = data[curBoard][curCat][curSub][p.key];
      setVal(curCat, curSub, p.key, !cur);
      buildNavTree(); renderParams();
    };
    wrap.append(tog, lbl);
    return wrap;
  }

  if (p.type === 'rng') {
    wrap.className = 'crange-wrap';
    const inp = document.createElement('input');
    inp.type = 'range'; inp.className = 'crange';
    inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = val;
    const display = document.createElement('span');
    display.className = 'crange-val'; display.textContent = val;
    inp.oninput = () => { display.textContent = inp.value; };
    inp.onchange = () => { setVal(curCat, curSub, p.key, +inp.value); buildNavTree(); };
    wrap.append(inp, display);
    return wrap;
  }

  if (p.type === 'sel') {
    const sel = document.createElement('select');
    sel.className = 'cinput' + (mod ? ' mod' : '');
    p.opts.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = o;
      if (String(val) === String(o)) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = () => { setVal(curCat, curSub, p.key, sel.value); buildNavTree(); sel.classList.add('mod'); };
    return sel;
  }

  // num
  const inp = document.createElement('input');
  inp.type = 'number'; inp.className = 'cinput' + (mod ? ' mod' : '');
  inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = val;
  inp.onchange = () => { setVal(curCat, curSub, p.key, +inp.value); buildNavTree(); inp.classList.add('mod'); };
  return inp;
}

function onSearch() {
  searchQ = document.getElementById('searchInput').value;
  renderParams();
}

/* ─── Board actions ─── */
function readParams()  { if(!curBoard) return toast('请先选择板卡','warn'); toast('已读取板卡参数','ok'); }
function sendBoard()   {
  if (!curBoard) return toast('请先选择板卡','warn');
  mods[curBoard].clear(); refreshBoardBadges(); buildNavTree(); renderParams(); updateSbar();
  toast(`参数已下发至 ${BOARDS.find(b=>b.id===curBoard)?.label} (${curBoard})`,'ok');
}
function resetBoard()  {
  if (!curBoard) return toast('请先选择板卡','warn');
  Object.entries(SCHEMA).forEach(([cat,cv]) =>
    Object.entries(cv.subs).forEach(([sub,sv]) =>
      sv.params.forEach(p => data[curBoard][cat][sub][p.key] = p.def)
    )
  );
  mods[curBoard].clear(); refreshBoardBadges(); buildNavTree(); renderParams(); updateSbar();
  toast('已恢复全部默认值','warn');
}
function sendAll() {
  BOARDS.forEach(b => mods[b.id].clear());
  refreshBoardBadges(); buildNavTree(); if(curCat&&curSub) renderParams(); updateSbar();
  toast('所有阵面参数已全部下发','ok');
}

/* ─── Compare ─── */
function openCmp() {
  // populate type selector
  const sel = document.getElementById('cmpType');
  sel.innerHTML = '';
  Object.entries(SCHEMA).forEach(([cat,cv]) => {
    Object.entries(cv.subs).forEach(([sub,sv]) => {
      const o = document.createElement('option');
      o.value = `${cat}/${sub}`; o.textContent = `${cv.label} › ${sv.label}`;
      sel.appendChild(o);
    });
  });
  if (curCat && curSub) sel.value = `${curCat}/${curSub}`;
  document.getElementById('cmpOverlay').classList.add('show');
  renderCmp();
}
function renderCmp() {
  const [cat, sub] = document.getElementById('cmpType').value.split('/');
  const diffOnly = document.getElementById('cmpDiffOnly').checked;
  const sv = SCHEMA[cat]?.subs[sub];
  if (!sv) return;

  const thead = `<thead><tr>
    <th>参数名</th><th>单位</th>
    ${BOARDS.map(b=>`<th>${b.face}<br/><small style="font-weight:400;color:var(--t3)">${b.label}</small>`).join('')}
  </tr></thead>`;

  const rows = sv.params.map(p => {
    const vals = BOARDS.map(b => String(data[b.id][cat][sub][p.key]));
    const hasDiff = new Set(vals).size > 1;
    if (diffOnly && !hasDiff) return '';
    const cells = vals.map(v => `<td class="${hasDiff?'cmp-diff':'cmp-same'}">${v}</td>`).join('');
    return `<tr><td style="white-space:nowrap;color:var(--t2)">${p.label}</td><td style="color:var(--t3);font-size:11px">${p.unit||'—'}</td>${cells}</tr>`;
  }).filter(Boolean).join('');

  document.getElementById('cmpTable').innerHTML = thead +
    `<tbody>${rows || '<tr><td colspan="99" style="text-align:center;padding:20px;color:var(--t3)">所有参数值相同</td></tr>'}</tbody>`;
}

/* ─── Config groups ─── */
const savedCfgs = [
  { name:'默认初始配置', time:'2026-04-01 08:00', snap:null },
  { name:'任务A搜索模式', time:'2026-04-02 14:30', snap:null },
];
function openCfg() {
  document.getElementById('cfgOverlay').classList.add('show');
  renderCfgList();
}
function renderCfgList() {
  const el = document.getElementById('cfgList');
  el.innerHTML = savedCfgs.map((c,i) => `
    <div class="cfg-item">
      <div>
        <div class="cfg-name">${c.name}</div>
        <div class="cfg-meta">保存时间: ${c.time}</div>
      </div>
      <div class="cfg-ia">
        <button class="btn btn-ghost" style="padding:3px 9px;font-size:11px" onclick="loadCfg(${i})">加载</button>
        <button class="btn btn-red"   style="padding:3px 9px;font-size:11px" onclick="deleteCfg(${i})">删除</button>
      </div>
    </div>`).join('');
}
function saveConfig() {
  const name = document.getElementById('saveNameInput').value.trim();
  if (!name) return toast('请输入配置组名称','warn');
  savedCfgs.push({ name, time: new Date().toLocaleString('zh-CN'), snap: JSON.parse(JSON.stringify(data)) });
  document.getElementById('saveNameInput').value = '';
  renderCfgList();
  toast(`配置组「${name}」已保存`,'ok');
}
function loadCfg(i) {
  const c = savedCfgs[i];
  if (c.snap) { Object.assign(data, JSON.parse(JSON.stringify(c.snap))); BOARDS.forEach(b=>mods[b.id].clear()); }
  if (curCat&&curSub) renderParams(); buildNavTree(); refreshBoardBadges(); updateSbar();
  document.getElementById('cfgOverlay').classList.remove('show');
  toast(`已加载配置组「${c.name}」`,'ok');
}
function deleteCfg(i) {
  const name = savedCfgs[i].name;
  savedCfgs.splice(i,1); renderCfgList();
  toast(`已删除「${name}」`,'warn');
}

/* ─── Utils ─── */
function updateSbar() {
  const n = curBoard ? mods[curBoard].size : 0;
  document.getElementById('sb3').textContent = n > 0 ? `${n} 项` : '无';
  document.getElementById('sbtime').textContent = new Date().toLocaleTimeString('zh-CN');
}
setInterval(updateSbar, 1000);

function closeIfBg(e, id) { if (e.target.id===id) document.getElementById(id).classList.remove('show'); }

function toast(msg, type='ok') {
  const icons = {ok:'✓', warn:'⚠', err:'✕'};
  const tc = document.getElementById('tc');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  tc.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ─── Init ─── */
initData();
buildBoardList();
refreshBoardBadges();
updateSbar();
selectBoard(BOARDS[0].id);
// auto-open first subcat
renderForm('signal', 'cfar');
// open its nav node
setTimeout(() => {
  document.querySelectorAll('.nav-cat-hd').forEach(h => {
    if (h.textContent.includes('信处')) h.classList.add('open');
  });
  document.getElementById('nl-signal-cfar')?.classList.add('sel');
}, 50);
</script>
